services:
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: astro
    ports: 
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astro"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@app-db:5432/astro?sslmode=disable
      - REDIS_ADDR=redis:6379
      - PEPPER=pepper-change-on-yours
      - JWT_SECRET=secret-wow-change-on-yours
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_started


volumes:
  pgdata:
  redisdata: