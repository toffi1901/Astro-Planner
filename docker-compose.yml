services:
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: astro
    ports: 
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astro"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
   
  migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:password@app-db:5432/astro?sslmode=disable", "up"]
    depends_on:
      app-db:
        condition: service_healthy
  
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@app-db:5432/astro?sslmode=disable
      - REDIS_ADDR=redis:6379
      - PEPPER=pepper-change-on-yours
      - JWT_SECRET=secret-wow-change-on-yours
    depends_on:
      app-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully 
      redis:
        condition: service_started
  s3:
    image: pgsty/silo:latest  
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me-long-password 
    command: server /data --console-address ":9001"
    volumes:
      - s3data:/data
  


volumes:
  pgdata:
  redisdata:
  s3data:
  